<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sando Media Feuerwerk Canvas</title>
<style>
  body {
    margin:0;
    overflow:hidden;
    background:#0f172a;
  }
  canvas {
    display:block;
  }

  /* Neuer blauer ovaler Login-Link */
  #geheim-link {
    position:fixed;
    bottom:20px;
    left:20px;
    font-size:16px;
    color:white;
    font-family:Arial, sans-serif;
    text-decoration:none;
    background:linear-gradient(90deg, #007BFF, #00C3FF);
    padding:10px 22px;
    border-radius:40px; /* Oval */
    box-shadow:0 0 10px rgba(0,0,0,0.4);
    transition:all 0.3s ease;
    z-index:10;
  }
  #geheim-link:hover {
    background:linear-gradient(90deg, #00C851, #007E33); /* Farbwechsel zu Grün */
    transform:scale(1.08);
  }

  /* Copyright unten rechts */
  #copyright {
    position:fixed;
    bottom:10px;
    right:10px;
    font-size:12px;
    color:#aaa;
    font-family:Arial, sans-serif;
    z-index:10;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- Neuer Link zum geheimen Bereich -->
<a id="geheim-link" href="https://sicher-login.vercel.app" target="_blank">🔒 Login</a>

<!-- Copyright sichtbar -->
<div id="copyright">
  © 2025 Peter M. von SandoMedia – All Rights Reserved
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    const angle = Math.random()*2*Math.PI;
    const speed = Math.random()*6 + 1;
    this.vx = Math.cos(angle)*speed;
    this.vy = Math.sin(angle)*speed;
    this.life = 0;
    this.maxLife = 100 + Math.random()*50;
    this.color = color;
    this.baseSize = Math.random()*4 + 1;
    this.size = this.baseSize;
    this.pulseSpeed = 0.05 + Math.random()*0.05;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life++;
    this.size = this.baseSize * (0.5 + 0.5*Math.sin(this.life*this.pulseSpeed));
  }
  draw() {
    ctx.globalAlpha = 1 - this.life/this.maxLife;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, 2*Math.PI);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

let particles = [];
const colors=["#FF0000","#FF7A00","#FFD500","#00D600","#00AAFF","#6B00FF","#FF2D95"];

function drawRainbowText(text, x, y, fontSize) {
  ctx.font = `${fontSize}px Arial`;
  ctx.textAlign = "center";
  let offsetX = x - ctx.measureText(text).width / 2;
  for(let i=0; i<text.length; i++){
    const char = text[i];
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillText(char, offsetX + ctx.measureText(text.slice(0,i)).width + ctx.measureText(char).width/2, y);
  }
}

function drawStar() {
  ctx.font = "60px Arial";
  ctx.textAlign = "center";
  ctx.fillStyle = "gold";
  ctx.fillText("★", W/2, H*0.5);

  drawRainbowText("Sando Media", W/2, H*0.2, 80);
  drawRainbowText("in Arbeit", W/2, H*0.3, 50);
}

function explode() {
  const centerX = W/2;
  const centerY = H*0.5;
  for(let i=0;i<100;i++){
    const color = colors[Math.floor(Math.random()*colors.length)];
    particles.push(new Particle(centerX, centerY, color));
  }
}

function animate() {
  ctx.clearRect(0,0,W,H);
  drawStar();

  particles.forEach((p,index)=>{
    p.update();
    p.draw();
    if(p.life > p.maxLife) particles.splice(index,1);
  });

  requestAnimationFrame(animate);
}

setInterval(explode, 2000);
animate();
</script>
</body>
</html>
